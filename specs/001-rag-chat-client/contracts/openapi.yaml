openapi: 3.0.3
info:
  title: RAG Chat Client API
  description: API contract for the RAG chat client. Client consumes this API; backend implements it.
  version: 1.0.0

servers:
  - url: /api
    description: Local API base

security:
  - cookieAuth: []
  - bearerAuth: []

paths:
  # --- Auth ---
  /auth/login:
    post:
      summary: Login
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        '200':
          description: Success; refresh token in HttpOnly cookie; access token in body
          headers:
            Set-Cookie:
              schema: { type: string }
              description: refresh_token=...; HttpOnly; Secure; SameSite=Strict
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }
                  expiresIn: { type: integer }
                  user: { $ref: '#/components/schemas/User' }
        '401':
          description: Invalid credentials

  /auth/refresh:
    post:
      summary: Refresh access token
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: New access token
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }
                  expiresIn: { type: integer }
        '401':
          description: Invalid or expired refresh token

  /auth/me:
    get:
      summary: Current user
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }

  # --- Chats ---
  /chats:
    get:
      summary: List chats
      parameters:
        - name: search
          in: query
          schema: { type: string }
          description: Search by chat name or message content
        - name: folderId
          in: query
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Chat' }
    post:
      summary: Create chat (or submit first message when no chat)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [query, documentGroupId]
              properties:
                query: { type: string }
                documentGroupId: { type: string }
      responses:
        '201':
          description: Chat created; response may stream via SSE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Chat' }
        '400':
          description: No documents in group; chat unavailable

  /chats/{chatId}:
    get:
      summary: Get chat with messages
      parameters:
        - name: chatId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Chat' }
                  - type: object
                    properties:
                      messages:
                        type: array
                        items: { $ref: '#/components/schemas/Message' }
        '404':
          description: Chat not found or access denied
    patch:
      summary: Update chat (rename, pin, move to folder)
      parameters:
        - name: chatId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                isPinned: { type: boolean }
                folderId: { type: string, nullable: true }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Chat' }
        '403':
          description: Not owner (for rename/delete)
    delete:
      summary: Delete chat (creator only)
      parameters:
        - name: chatId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Deleted
        '403':
          description: Not creator

  /chats/{chatId}/messages:
    post:
      summary: Submit question to chat
      parameters:
        - name: chatId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string }
      responses:
        '201':
          description: Message added; response may stream via SSE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '400':
          description: No documents in group
        '404':
          description: Chat not found

  /chats/{chatId}/share:
    post:
      summary: Share chat with user
      parameters:
        - name: chatId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [identifier]
              properties:
                identifier: { type: string }
                  description: Username or email of recipient
      responses:
        '200':
          description: Access granted
        '403':
          description: Not owner
        '404':
          description: Recipient not found

  /chats/{chatId}/revoke/{userId}:
    delete:
      summary: Revoke access for user
      parameters:
        - name: chatId
          in: path
          required: true
          schema: { type: string }
        - name: userId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Access revoked
        '403':
          description: Not owner or cannot revoke owner

  # --- Document Groups ---
  /document-groups:
    get:
      summary: List document groups
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DocumentGroup' }
    post:
      summary: Create document group (admin only)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentGroup' }
        '403':
          description: Not admin

  /document-groups/{groupId}:
    get:
      summary: Get group with document count
      parameters:
        - name: groupId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentGroup' }

  # --- Documents ---
  /documents:
    get:
      summary: List documents (admin only)
      parameters:
        - name: groupId
          in: query
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Document' }
        '403':
          description: Not admin
    post:
      summary: Upload PDF (admin only)
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, groupId]
              properties:
                file:
                  type: string
                  format: binary
                  description: PDF file, max 20MB
                groupId: { type: string }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '400':
          description: Invalid file (not PDF, >20MB, corrupted)
        '403':
          description: Not admin

  /documents/{documentId}/view:
    get:
      summary: Open document at page (for citation links)
      parameters:
        - name: documentId
          in: path
          required: true
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: Document content or redirect to viewer
        '302':
          description: Redirect to document URL
        '404':
          description: Document not found

  # --- Chat Folders ---
  /chat-folders:
    get:
      summary: List user's folders
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ChatFolder' }
    post:
      summary: Create folder
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatFolder' }

  /chat-folders/{folderId}:
    patch:
      summary: Update folder or move chat into folder
      parameters:
        - name: folderId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                chatIds: { type: array, items: { type: string } }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatFolder' }
    delete:
      summary: Delete folder
      parameters:
        - name: folderId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Deleted

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: refresh_token
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      required: [id, username, role]
      properties:
        id: { type: string }
        username: { type: string }
        email: { type: string }
        role: { type: string, enum: [regular, admin] }

    Chat:
      type: object
      required: [id, name, ownerId, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        ownerId: { type: string }
        documentGroupId: { type: string }
        isPinned: { type: boolean, default: false }
        folderId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Message:
      type: object
      required: [id, chatId, role, content, createdAt]
      properties:
        id: { type: string }
        chatId: { type: string }
        role: { type: string, enum: [user, assistant] }
        content: { type: string }
        citations:
          type: array
          items: { $ref: '#/components/schemas/Citation' }
        createdAt: { type: string, format: date-time }

    Citation:
      type: object
      required: [documentId, documentName, page]
      properties:
        documentId: { type: string }
        documentName: { type: string }
        page: { type: integer }
        url: { type: string }

    Document:
      type: object
      required: [id, name, groupId]
      properties:
        id: { type: string }
        name: { type: string }
        groupId: { type: string }
        sizeBytes: { type: integer }
        uploadedAt: { type: string, format: date-time }

    DocumentGroup:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        documentCount: { type: integer }

    ChatFolder:
      type: object
      required: [id, name, userId]
      properties:
        id: { type: string }
        name: { type: string }
        userId: { type: string }
        chatIds: { type: array, items: { type: string } }
